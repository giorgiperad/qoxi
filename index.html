<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#f1f5f9">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Darka Life</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2910/2910768.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;600;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        :root {
            --bg: #f8fafc;
            --surface: #ffffff;
            --text-dark: #1e293b;
            --text-light: #64748b;
            --primary: #0f172a;
            --accent-green: #10b981; /* Hunting */
            --accent-blue: #3b82f6;  /* Fishing */
            --accent-orange: #f59e0b; /* Feasting */
            --radius: 24px;
            --shadow: 0 10px 40px -10px rgba(0,0,0,0.08);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Inter', 'Noto Sans Georgian', sans-serif;
            background-color: var(--bg);
            color: var(--text-dark);
            margin: 0; padding: 0;
            padding-bottom: 90px;
        }

        .container { max-width: 500px; margin: 0 auto; padding: 20px; }

        /* HEADER */
        header { 
            display: flex; justify-content: space-between; align-items: center; 
            margin-bottom: 20px; padding-top: 10px;
        }
        .logo-area h1 { margin: 0; font-size: 1.8rem; font-weight: 900; letter-spacing: -1px; }
        .logo-area span { font-size: 0.8rem; color: var(--text-light); font-weight: 600; }
        
        .gps-badge {
            background: #e2e8f0; padding: 8px 12px; border-radius: 50px;
            font-size: 0.75rem; font-weight: 700; color: var(--text-dark);
            display: flex; align-items: center; gap: 5px;
        }

        /* VERDICT CARD (The Fun Part) */
        .verdict-card {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            color: white;
            border-radius: var(--radius);
            padding: 25px;
            position: relative;
            overflow: hidden;
            box-shadow: var(--shadow);
            margin-bottom: 20px;
            text-align: center;
        }
        .verdict-emoji { font-size: 3rem; margin-bottom: 10px; display: block; animation: bounce 2s infinite; }
        .verdict-title { font-size: 1.5rem; font-weight: 800; line-height: 1.2; margin-bottom: 5px; }
        .verdict-sub { font-size: 0.9rem; opacity: 0.8; }
        
        /* Stats in Verdict */
        .verdict-stats {
            display: flex; justify-content: space-between; margin-top: 20px;
            background: rgba(255,255,255,0.1); padding: 15px; border-radius: 16px;
        }
        .v-stat { text-align: center; }
        .v-val { font-size: 1.2rem; font-weight: 700; }
        .v-lbl { font-size: 0.7rem; opacity: 0.7; text-transform: uppercase; }

        /* ACTIVITY GRID (Percentages) */
        .activity-grid {
            display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 30px;
        }
        .act-card {
            background: var(--surface); border-radius: 20px; padding: 15px 10px;
            text-align: center; box-shadow: var(--shadow);
            transition: transform 0.2s; border: 2px solid transparent;
        }
        .act-card:active { transform: scale(0.95); }
        .act-icon { font-size: 1.8rem; margin-bottom: 5px; }
        .act-name { font-size: 0.75rem; font-weight: 600; color: var(--text-light); }
        .act-percent { font-size: 1.1rem; font-weight: 800; margin-top: 2px; }
        
        /* Progress Bar inside Card */
        .progress-bar { height: 4px; width: 100%; background: #e2e8f0; border-radius: 2px; margin-top: 8px; overflow:hidden; }
        .progress-fill { height: 100%; border-radius: 2px; transition: width 1s ease; }

        /* HOURLY SCROLL */
        .section-title { font-size: 1.1rem; font-weight: 800; margin-bottom: 15px; color: var(--text-dark); display: flex; align-items: center; gap: 8px;}
        .scroll-container { 
            display: flex; gap: 12px; overflow-x: auto; padding-bottom: 20px; 
            margin: 0 -20px; padding-left: 20px; padding-right: 20px;
            scrollbar-width: none; 
        }
        .scroll-container::-webkit-scrollbar { display: none; }
        
        .hour-pill {
            min-width: 70px; background: var(--surface); padding: 12px; border-radius: 16px;
            text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.03); border: 1px solid #f1f5f9;
        }
        .h-time { font-size: 0.8rem; color: var(--text-light); font-weight: 600; margin-bottom: 5px; }
        .h-icon { font-size: 1.5rem; margin-bottom: 5px; color: var(--text-dark); }
        .h-temp { font-weight: 700; font-size: 1rem; }

        /* DAILY LIST */
        .day-row {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--surface); padding: 16px; border-radius: 16px;
            margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }
        .d-left { display: flex; align-items: center; gap: 15px; }
        .d-icon { font-size: 1.8rem; color: var(--text-dark); width: 30px; text-align: center;}
        .d-info h4 { margin: 0; font-size: 1rem; }
        .d-info span { font-size: 0.8rem; color: var(--text-light); }
        .d-right { text-align: right; }
        .d-high { font-weight: 700; font-size: 1.1rem; }
        .d-low { font-size: 0.9rem; color: var(--text-light); }
        
        /* Install Button */
        #installBtn {
            position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%);
            background: var(--text-dark); color: white; padding: 14px 28px;
            border-radius: 50px; border: none; font-weight: 700; cursor: pointer;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2); z-index: 100; display: none;
            display: flex; align-items: center; gap: 8px;
        }

        /* Animations */
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
        .loader { text-align: center; padding: 50px; }

    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="logo-area">
            <h1>დარყა</h1>
            <span>ლაშკინის მეტეო-ცენტრი</span>
        </div>
        <div class="gps-badge" onclick="location.reload()">
            <i class="ph-bold ph-map-pin"></i> დარყა
        </div>
    </header>

    <div id="app">
        <div class="loader"><i class="ph-bold ph-spinner-gap" style="font-size: 2rem; animation: spin 1s infinite linear;"></i></div>
    </div>

    <button id="installBtn"><i class="ph-bold ph-download-simple"></i> დააყენე</button>
</div>

<script>
    // --- PWA ---
    let deferredPrompt; const installBtn = document.getElementById('installBtn');
    window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; installBtn.style.display = 'flex'; });
    installBtn.addEventListener('click', (e) => { installBtn.style.display = 'none'; deferredPrompt.prompt(); });
    if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('/sw.js'); }); }

    // --- LOGIC ---
    const API_URL = "https://api.open-meteo.com/v1/forecast?latitude=42.332771&longitude=43.553488&current=temperature_2m,weather_code,wind_speed_10m,precipitation,is_day&hourly=temperature_2m,weather_code,precipitation_probability,is_day&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum&timezone=auto&forecast_days=10";

    const KA_DAYS = ['კვირა', 'ორშაბათი', 'სამშაბათი', 'ოთხშაბათი', 'ხუთშაბათი', 'პარასკევი', 'შაბათი'];
    
    // Fun Phrases Generator
    function getVerdict(temp, rain, wind, code, isDay) {
        // 1. Catastrophe
        if (code >= 95) return { title: "აპოკალიფსია!", sub: "გარეთ ცხვირი არ გაყო.", emoji: "⛈️" };
        if (wind > 30) return { title: "სახურავს ახდის!", sub: "ისეთი ქარია, დაგაფრენს.", emoji: "🌪️" };
        if (rain > 15) return { title: "წვიმა კი არა, წარღვნაა", sub: "გახსენი ღვინო და დაჯექი სახლში.", emoji: "🍷" };
        
        // 2. Cold
        if (temp < 0) return { title: "ყინავს ძმაო", sub: "ჩაიცვი თბილად, ფეჩი დაანთე.", emoji: "🥶" };
        
        // 3. Perfect Hunting
        if ([51,53,61,45,2,3].includes(code) && wind < 15 && isDay) {
            return { title: "ტყე გეძახის!", sub: "ნადირობისთვის იდეალური პირობებია.", emoji: "🦌" };
        }

        // 4. Perfect Feasting
        if (rain === 0 && temp > 15 && isDay) {
            return { title: "საქეიფოა!", sub: "აბა ჰე, მწვადები შეყარე!", emoji: "🍖" };
        }

        // 5. Normal
        if (!isDay) return { title: "ღამე მშვიდობისა", sub: "ხვალ ახალი დღე იქნება.", emoji: "🌙" };
        return { title: "სტანდარტული სიტუაცია", sub: "არც ცივა, არც ცხელა.", emoji: "🤷‍♂️" };
    }

    // Score Calculator (0-100%)
    function getScores(temp, rain, wind, code) {
        // Hunt Score
        let hunt = 50; 
        if(wind > 20) hunt -= 30; if(wind < 10) hunt += 20;
        if(rain > 5) hunt -= 20; if([45,48,2,3].includes(code)) hunt += 20; // Fog is good
        if(code >= 95) hunt = 0;
        
        // Fish Score
        let fish = 60;
        if(code === 2 || code === 3) fish += 30; // Cloudy is good
        if(rain > 0 && rain < 5) fish += 20; // Light rain is good
        if(code < 2) fish -= 20; // Bright sun is bad
        
        // Feast Score
        let feast = 50;
        if(rain === 0) feast += 30;
        if(temp > 18) feast += 20;
        if(wind > 15) feast -= 30;
        if(rain > 0) feast = 10;

        return { 
            hunt: Math.min(100, Math.max(0, hunt)), 
            fish: Math.min(100, Math.max(0, fish)), 
            feast: Math.min(100, Math.max(0, feast)) 
        };
    }

    const ICONS = { 0:"sun", 1:"sun-horizon", 2:"cloud-sun", 3:"cloud", 45:"cloud-fog", 61:"cloud-rain", 71:"cloud-snow", 95:"cloud-lightning" };
    function getIcon(c) { return ICONS[c] || "cloud-sun"; }

    async function init() {
        try {
            const res = await fetch(API_URL); const data = await res.json(); render(data);
        } catch(e) { document.getElementById('app').innerHTML = `<h3 style="text-align:center; margin-top:50px;">ინტერნეტი გაითიშა ❌</h3>`; }
    }

    function render(data) {
        const cur = data.current;
        const verdict = getVerdict(cur.temperature_2m, cur.precipitation, cur.wind_speed_10m, cur.weather_code, cur.is_day);
        const scores = getScores(cur.temperature_2m, cur.precipitation, cur.wind_speed_10m, cur.weather_code);

        let html = `
            <div class="verdict-card">
                <span class="verdict-emoji">${verdict.emoji}</span>
                <div class="verdict-title">${verdict.title}</div>
                <div class="verdict-sub">${verdict.sub}</div>
                
                <div class="verdict-stats">
                    <div class="v-stat"><div class="v-val">${Math.round(cur.temperature_2m)}°</div><div class="v-lbl">ტემპ.</div></div>
                    <div class="v-stat"><div class="v-val">${cur.wind_speed_10m}</div><div class="v-lbl">ქარი</div></div>
                    <div class="v-stat"><div class="v-val">${cur.precipitation}</div><div class="v-lbl">წვიმა</div></div>
                </div>
            </div>

            <div class="section-title"><i class="ph-fill ph-chart-bar"></i> წარმატების შანსი</div>
            <div class="activity-grid">
                <div class="act-card" style="border-color:${scores.hunt > 70 ? 'var(--accent-green)' : 'transparent'}">
                    <div class="act-icon" style="color:var(--accent-green)">🦌</div>
                    <div class="act-name">ნადირობა</div>
                    <div class="act-percent">${scores.hunt}%</div>
                    <div class="progress-bar"><div class="progress-fill" style="width:${scores.hunt}%; background:var(--accent-green)"></div></div>
                </div>
                <div class="act-card" style="border-color:${scores.fish > 70 ? 'var(--accent-blue)' : 'transparent'}">
                    <div class="act-icon" style="color:var(--accent-blue)">🎣</div>
                    <div class="act-name">თევზაობა</div>
                    <div class="act-percent">${scores.fish}%</div>
                    <div class="progress-bar"><div class="progress-fill" style="width:${scores.fish}%; background:var(--accent-blue)"></div></div>
                </div>
                <div class="act-card" style="border-color:${scores.feast > 70 ? 'var(--accent-orange)' : 'transparent'}">
                    <div class="act-icon" style="color:var(--accent-orange)">🍷</div>
                    <div class="act-name">ქეიფი</div>
                    <div class="act-percent">${scores.feast}%</div>
                    <div class="progress-bar"><div class="progress-fill" style="width:${scores.feast}%; background:var(--accent-orange)"></div></div>
                </div>
            </div>

            <div class="section-title"><i class="ph-fill ph-clock-afternoon"></i> დღის გეგმა</div>
            <div class="scroll-container">
                ${data.hourly.time.slice(0,24).map((t, i) => {
                    const hTime = new Date(t);
                    if (hTime < new Date()) return ''; // Don't show past hours
                    return `
                    <div class="hour-pill">
                        <div class="h-time">${hTime.getHours()}:00</div>
                        <div class="h-icon"><i class="ph-fill ph-${getIcon(data.hourly.weather_code[i])}"></i></div>
                        <div class="h-temp">${Math.round(data.hourly.temperature_2m[i])}°</div>
                    </div>`;
                }).join('')}
            </div>

            <div class="section-title" style="margin-top:30px;"><i class="ph-fill ph-calendar-blank"></i> 10 დღის პროგნოზი</div>
            <div>
                ${data.daily.time.map((t, i) => `
                <div class="day-row">
                    <div class="d-left">
                        <div class="d-icon"><i class="ph-fill ph-${getIcon(data.daily.weather_code[i])}"></i></div>
                        <div class="d-info">
                            <h4>${i===0 ? 'დღეს' : KA_DAYS[new Date(t).getDay()]}</h4>
                            <span>${data.daily.precipitation_sum[i] > 0 ? 'წვიმა: '+data.daily.precipitation_sum[i]+'მმ' : 'მშრალი'}</span>
                        </div>
                    </div>
                    <div class="d-right">
                        <div class="d-high">${Math.round(data.daily.temperature_2m_max[i])}°</div>
                        <div class="d-low">${Math.round(data.daily.temperature_2m_min[i])}°</div>
                    </div>
                </div>`).join('')}
            </div>
        `;
        document.getElementById('app').innerHTML = html;
    }
    
    init();
</script>
<style> @keyframes spin { 100% { transform: rotate(360deg); } } </style>
</body>
</html>
