<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#2563eb">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="დარყა">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2910/2910768.png">
    <title>Lashkin Meteo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;600;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        :root {
            --bg: #f1f5f9;
            --surface: #ffffff;
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --primary: #2563eb;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Inter', 'Noto Sans Georgian', sans-serif;
            background-color: var(--bg);
            color: var(--text-dark);
            margin: 0; padding: 0;
            padding-bottom: 80px;
        }

        /* HEADER */
        .main-header {
            background: linear-gradient(180deg, #2563eb 0%, #1d4ed8 100%);
            color: white;
            padding: 25px 25px 45px 25px;
            border-radius: 0 0 35px 35px;
            box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.4);
            margin-bottom: 25px;
        }

        .top-bar { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 25px; }
        .brand-box { display: flex; flex-direction: column; }
        .app-name { font-weight: 800; font-size: 1.4rem; letter-spacing: -0.5px; display: flex; align-items: center; gap: 6px; }
        .app-subtitle { font-size: 0.8rem; opacity: 0.8; font-weight: 500; margin-top: 2px; letter-spacing: 0.3px; }

        .refresh-btn { background: rgba(255,255,255,0.2); border: none; color: white; padding: 10px; border-radius: 50%; cursor: pointer; transition: transform 0.2s; margin-top: 5px; }
        .refresh-btn:active { transform: scale(0.95); }

        .current-weather { text-align: center; margin-top: 10px; }
        .big-temp { font-size: 5rem; font-weight: 800; line-height: 1; letter-spacing: -3px; margin-bottom: 5px; }
        .condition-text { font-size: 1.2rem; font-weight: 500; opacity: 0.9; margin-bottom: 25px; text-transform: capitalize; }
        
        .weather-stats {
            display: flex; justify-content: center; gap: 30px;
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(5px);
            padding: 15px 25px; border-radius: 20px;
            max-width: fit-content; margin: 0 auto;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .stat-item { display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .stat-val { font-weight: 700; font-size: 1rem; }
        .stat-label { font-size: 0.7rem; opacity: 0.8; text-transform: uppercase; letter-spacing: 0.5px; }

        .container { max-width: 550px; margin: 0 auto; padding: 0 20px; }
        .section-title { font-size: 0.9rem; font-weight: 700; color: var(--text-muted); margin: 30px 0 15px 0; display: flex; align-items: center; gap: 8px; text-transform: uppercase; letter-spacing: 0.5px; }

        /* HUNTING CARD (NEW) */
        .hunt-card {
            background: linear-gradient(135deg, #059669 0%, #10b981 100%);
            color: white;
            padding: 25px;
            border-radius: 24px;
            box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.4);
            display: flex; justify-content: space-between; align-items: center;
            position: relative; overflow: hidden;
            margin-bottom: 30px;
        }
        .hunt-content { z-index: 2; position: relative; }
        .hunt-label { font-size: 0.75rem; text-transform: uppercase; opacity: 0.9; letter-spacing: 1px; font-weight: 600; margin-bottom: 5px; }
        .hunt-verdict { font-size: 1.3rem; font-weight: 800; line-height: 1.2; margin-bottom: 5px; }
        .hunt-details { font-size: 0.85rem; opacity: 0.9; display: flex; gap: 10px; align-items: center; }
        
        .hunt-score-box { 
            z-index: 2; 
            background: rgba(255,255,255,0.2); 
            backdrop-filter: blur(5px);
            border-radius: 16px;
            padding: 10px 15px;
            text-align: center;
            min-width: 80px;
        }
        .hunt-percent { font-size: 1.8rem; font-weight: 800; }
        .hunt-sub { font-size: 0.7rem; font-weight: 600; text-transform: uppercase; }

        .hunt-bg-icon { position: absolute; right: -10px; bottom: -20px; font-size: 8rem; opacity: 0.15; transform: rotate(-10deg); z-index: 1; pointer-events: none; }

        /* SCROLL */
        .scroll-wrap { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 15px; margin: 0 -20px; padding-left: 20px; padding-right: 20px; scrollbar-width: none; }
        .scroll-wrap::-webkit-scrollbar { display: none; }
        .h-item { min-width: 75px; background: var(--surface); padding: 15px 10px; border-radius: 18px; text-align: center; box-shadow: var(--shadow); }
        .h-time { font-size: 0.8rem; color: var(--text-muted); font-weight: 600; margin-bottom: 8px; }
        .h-icon { font-size: 1.6rem; margin-bottom: 8px; color: var(--primary); }
        .h-temp { font-weight: 700; font-size: 1.1rem; }

        /* LIST */
        .day-item { display: flex; justify-content: space-between; align-items: center; background: var(--surface); padding: 16px 20px; border-radius: 18px; margin-bottom: 12px; box-shadow: var(--shadow); }
        .d-left { display: flex; align-items: center; gap: 15px; }
        .d-icon { font-size: 1.8rem; color: var(--text-muted); width: 35px; text-align: center; }
        .d-date h4 { margin: 0; font-size: 1rem; font-weight: 600; }
        .d-date span { font-size: 0.8rem; color: var(--text-muted); display: block; margin-top: 2px; }
        .d-temp { font-weight: 700; font-size: 1.1rem; text-align: right; }
        .d-low { font-size: 0.9rem; color: var(--text-muted); font-weight: 500; margin-left: 6px; }

        #loader { text-align:center; padding:50px; color:var(--text-muted); }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="app">
        <div id="loader"><i class="ph-bold ph-spinner-gap" style="font-size:2rem; animation:spin 1s infinite linear;"></i></div>
    </div>

<script>
    const LAT = 42.332771;
    const LON = 43.553488;
    const DAYS = ['კვირა', 'ორშაბათი', 'სამშაბათი', 'ოთხშაბათი', 'ხუთშაბათი', 'პარასკევი', 'შაბათი'];
    
    const ICONS = {
        0: {i:"sun", t:"მოწმენდილი"}, 1: {i:"sun", t:"მზიანი"}, 2: {i:"cloud-sun", t:"ნაწილობრივ ღრუბლიანი"},
        3: {i:"cloud", t:"მოღრუბლული"}, 45: {i:"cloud-fog", t:"ნისლი"}, 48: {i:"cloud-fog", t:"ნისლი"},
        51: {i:"cloud-drizzle", t:"ჟინჟღლი"}, 53: {i:"cloud-drizzle", t:"ჟინჟღლი"}, 55: {i:"cloud-drizzle", t:"ჟინჟღლი"},
        61: {i:"cloud-rain", t:"წვიმა"}, 63: {i:"cloud-rain", t:"წვიმა"}, 65: {i:"cloud-rain", t:"ძლიერი წვიმა"},
        71: {i:"cloud-snow", t:"თოვლი"}, 73: {i:"cloud-snow", t:"თოვლი"}, 75: {i:"cloud-snow", t:"ძლიერი თოვლი"},
        80: {i:"cloud-rain", t:"წვიმა"}, 81: {i:"cloud-rain", t:"ძლიერი წვიმა"}, 82: {i:"cloud-rain", t:"თავსხმა"},
        85: {i:"cloud-snow", t:"თოვლჭყაპი"}, 95: {i:"cloud-lightning", t:"ჭექა-ქუხილი"}
    };

    function getWeatherInfo(code, isDay = 1) {
        let info = ICONS[code] || {i:"cloud", t:"უცნობია"};
        let icon = info.i;
        if (!isDay && (code === 0 || code === 1)) icon = "moon";
        if (!isDay && code === 2) icon = "cloud-moon";
        return { icon: icon, text: info.t };
    }

    // HUNTING LOGIC ONLY
    function calcHuntScore(r, w, c) {
        let h = 60;
        if(w < 10) h += 20; 
        if(w > 20) h -= 30;
        if([45,48,2,3].includes(c)) h += 20; // Cloud cover is good
        if(r > 5) h -= 20; // Heavy rain bad
        if(r > 0 && r <= 5) h += 5; // Light rain okay to hide scent
        return Math.min(100, Math.max(0, h));
    }

    function getHuntText(score) {
        if(score >= 80) return "ტყე გეძახის! იდეალური ამინდია.";
        if(score >= 50) return "პირობები ნორმალურია.";
        return "დღეს სახლში დარჩი.";
    }

    async function init() {
        try {
            const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=temperature_2m,weather_code,wind_speed_10m,precipitation,is_day&hourly=temperature_2m,weather_code,is_day&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum&timezone=auto&forecast_days=10`);
            const data = await res.json();
            render(data);
        } catch(e) {
            document.getElementById('app').innerHTML = '<div style="text-align:center;padding:50px;">შეცდომა!</div>';
        }
    }

    function render(data) {
        const cur = data.current;
        const wInfo = getWeatherInfo(cur.weather_code, cur.is_day);
        
        const huntScore = calcHuntScore(cur.precipitation, cur.wind_speed_10m, cur.weather_code);
        const huntText = getHuntText(huntScore);
        
        const now = new Date();
        const startIdx = now.getHours();
        const next24 = data.hourly.time.slice(startIdx, startIdx + 24);

        let html = `
            <div class="main-header">
                <div class="top-bar">
                    <div class="brand-box">
                        <div class="app-name"><i class="ph-bold ph-map-pin"></i> დარყა</div>
                        <div class="app-subtitle">ლაშკინის მეტეო ცენტრი</div>
                    </div>
                    <button class="refresh-btn" onclick="init()"><i class="ph-bold ph-arrows-clockwise"></i></button>
                </div>
                
                <div class="current-weather">
                    <div class="big-temp">${Math.round(cur.temperature_2m)}°</div>
                    <div class="condition-text">${wInfo.text}</div>
                    
                    <div class="weather-stats">
                        <div class="stat-item">
                            <i class="ph-fill ph-wind" style="font-size:1.2rem;"></i>
                            <span class="stat-val">${cur.wind_speed_10m}</span>
                            <span class="stat-label">ქარი</span>
                        </div>
                        <div class="stat-item" style="border-left:1px solid rgba(255,255,255,0.3); padding-left:25px;">
                            <i class="ph-fill ph-drop" style="font-size:1.2rem;"></i>
                            <span class="stat-val">${cur.precipitation}</span>
                            <span class="stat-label">ნალექი</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="container">
                
                <div class="hunt-card">
                    <div class="hunt-bg-icon">🦌</div>
                    <div class="hunt-content">
                        <div class="hunt-label"><i class="ph-fill ph-crosshair"></i> ნადირობის ინდექსი</div>
                        <div class="hunt-verdict">${huntText}</div>
                        <div class="hunt-details">ქარი: ${cur.wind_speed_10m} კმ/სთ</div>
                    </div>
                    <div class="hunt-score-box">
                        <div class="hunt-percent">${huntScore}%</div>
                        <div class="hunt-sub"></div>
                    </div>
                </div>

                <div class="section-title"><i class="ph-fill ph-clock-afternoon"></i> დღის ამინდი</div>
                <div class="scroll-wrap">
                    ${next24.map((t, i) => {
                        const idx = startIdx + i;
                        if(!data.hourly.temperature_2m[idx]) return '';
                        const hInfo = getWeatherInfo(data.hourly.weather_code[idx], data.hourly.is_day[idx]);
                        return `
                        <div class="h-item">
                            <div class="h-time">${new Date(t).getHours()}:00</div>
                            <div class="h-icon" style="color:${data.hourly.is_day[idx] ? '#f59e0b' : '#64748b'}">
                                <i class="ph-fill ph-${hInfo.icon}"></i>
                            </div>
                            <div class="h-temp">${Math.round(data.hourly.temperature_2m[idx])}°</div>
                        </div>`;
                    }).join('')}
                </div>

                <div class="section-title" style="margin-top:30px;"><i class="ph-fill ph-calendar-blank"></i> 10 დღის პროგნოზი</div>
                <div>
                    ${data.daily.time.map((t, i) => {
                        const dInfo = getWeatherInfo(data.daily.weather_code[i]);
                        return `
                        <div class="day-item">
                            <div class="d-left">
                                <div class="d-icon"><i class="ph-fill ph-${dInfo.icon}"></i></div>
                                <div class="d-date">
                                    <h4>${i===0?'დღეს':DAYS[new Date(t).getDay()]}</h4>
                                    <span>${dInfo.text}</span>
                                </div>
                            </div>
                            <div class="d-temp">
                                ${Math.round(data.daily.temperature_2m_max[i])}°
                                <span class="d-low">${Math.round(data.daily.temperature_2m_min[i])}°</span>
                            </div>
                        </div>`;
                    }).join('')}
                </div>
            </div>
        `;
        document.getElementById('app').innerHTML = html;
    }
    init();
</script>
</body>
</html>
