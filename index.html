<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#050a05">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Darka Ops">
    
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/1146/1146869.png">

    <title>Hunter Ops - Darka</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        :root {
            --bg-dark: #050a05;
            --card-bg: rgba(20, 35, 25, 0.85);
            --card-border: rgba(74, 222, 128, 0.2);
            --accent: #4ade80;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --radius-box: 16px;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at center, transparent 0%, #000 130%),
                url('https://images.unsplash.com/photo-1596707323214-433b00683057?ixlib=rb-4.0.3&auto=format&fit=crop&w=1000&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            min-height: 100vh;
            overflow-x: hidden;
            padding-bottom: 80px; /* ადგილი ინსტალაციის ღილაკისთვის */
        }

        /* Tactical Overlays */
        body::before {
            content: ""; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 80vw; height: 1px; background: rgba(74, 222, 128, 0.1); pointer-events: none; z-index: -1;
        }
        body::after {
            content: ""; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 1px; height: 80vh; background: rgba(74, 222, 128, 0.1); pointer-events: none; z-index: -1;
        }

        .app-container { max-width: 600px; margin: 0 auto; position: relative; z-index: 1; }

        header { text-align: center; margin-bottom: 25px; padding-top: 10px; }
        
        .gps-tag {
            display: inline-flex; align-items: center; gap: 8px;
            background: rgba(0, 0, 0, 0.6); border: 1px solid var(--accent);
            color: var(--accent); padding: 6px 16px; border-radius: 4px;
            font-size: 0.8rem; font-weight: 700; margin-bottom: 10px;
            font-family: 'JetBrains Mono', monospace; letter-spacing: 1px;
            box-shadow: 0 0 10px rgba(74, 222, 128, 0.2);
        }

        h1 { margin: 0; font-size: 2.2rem; font-weight: 900; text-transform: uppercase; letter-spacing: -1px; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }

        .glass {
            background: var(--card-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border); border-radius: var(--radius-box);
            padding: 20px; margin-bottom: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            position: relative; overflow: hidden;
        }
        .glass::after {
            content: ""; position: absolute; top: 0; right: 0; width: 0; height: 0;
            border-style: solid; border-width: 0 30px 30px 0;
            border-color: transparent rgba(74, 222, 128, 0.1) transparent transparent;
        }

        /* Weather UI */
        .hero-top { display: flex; align-items: flex-start; justify-content: space-between; }
        .temp-huge { font-size: 4.5rem; font-weight: 800; line-height: 1; font-family: 'JetBrains Mono', monospace; letter-spacing: -3px; }
        .condition-icon i { font-size: 4rem; color: #fff; filter: drop-shadow(0 0 8px rgba(255,255,255,0.4)); }
        .condition-text { font-size: 1.2rem; font-weight: 700; margin-top: 5px; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; }
        .last-update { font-size: 0.7rem; color: var(--text-muted); margin-top: 15px; display: flex; align-items: center; gap: 5px; font-family: 'JetBrains Mono', monospace; }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .stat-box { background: rgba(0,0,0,0.3); border-radius: 12px; padding: 15px; display: flex; flex-direction: column; gap: 5px; border: 1px solid rgba(255,255,255,0.05); }
        .stat-label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; display: flex; align-items: center; gap: 6px; }
        .stat-value { font-size: 1.2rem; font-weight: 700; font-family: 'JetBrains Mono', monospace; }
        .wind-box { grid-column: span 2; background: linear-gradient(90deg, rgba(74, 222, 128, 0.1), transparent); border-left: 3px solid var(--accent); }
        .wind-val { font-size: 1.5rem; display: flex; align-items: center; gap: 10px; }
        
        .section-title { font-size: 0.9rem; font-weight: 700; margin: 25px 0 10px 5px; text-transform: uppercase; color: var(--accent); letter-spacing: 1px; display: flex; align-items: center; gap: 8px; }
        .scroll-container { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; margin: 0 -15px; padding-left: 15px; padding-right: 15px; scrollbar-width: none; }
        .scroll-container::-webkit-scrollbar { display: none; }
        .hourly-card { min-width: 70px; background: rgba(0,0,0,0.4); border-radius: 10px; padding: 12px 5px; text-align: center; border: 1px solid var(--card-border); }
        
        .daily-row { display: grid; grid-template-columns: 1fr 50px 1fr 40px; align-items: center; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .daily-row:last-child { border-bottom: none; }
        .d-day { font-weight: 700; font-size: 0.95rem; text-transform: uppercase; }
        .d-date { font-size: 0.7rem; color: var(--text-muted); display: block; font-family: 'JetBrains Mono', monospace; }
        .d-temps { text-align: right; font-weight: 600; font-family: 'JetBrains Mono', monospace; }
        .d-min { color: var(--text-muted); font-size: 0.9rem; margin-left: 5px; }

        /* Install Button */
        #installBtn {
            display: none;
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--accent);
            color: #000;
            border: none;
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: 800;
            font-family: 'JetBrains Mono', monospace;
            text-transform: uppercase;
            box-shadow: 0 0 20px rgba(74, 222, 128, 0.4);
            z-index: 100;
            cursor: pointer;
            animation: pulse 2s infinite;
        }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(74, 222, 128, 0); } 100% { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0); } }

        .loader-box { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 300px; }
        .radar { font-size: 4rem; color: var(--accent); animation: spin 2s linear infinite; filter: drop-shadow(0 0 10px var(--accent)); }
        @keyframes spin { 100% { transform: rotate(360deg); } }

    </style>
</head>
<body>

<div class="app-container">
    <header>
        <div class="gps-tag"><i class="ph-bold ph-crosshair"></i> N 42.332 • E 43.553</div>
        <h1>DARKA OPS</h1>
        <div class="text-muted" style="font-size: 0.8rem; letter-spacing: 2px; text-transform: uppercase;">სანადირო მეტეო-ცენტრი</div>
    </header>

    <div id="app">
        <div class="glass loader-box">
            <i class="ph-thin ph-crosshair radar"></i>
            <p style="margin-top: 20px; font-family: 'JetBrains Mono'; font-size: 0.9rem; color: var(--accent);">მონაცემების სკანირება...</p>
        </div>
    </div>

    <button id="installBtn"><i class="ph-bold ph-download-simple"></i> აპლიკაციის დაყენება</button>
</div>

<script>
    // --- PWA INSTALLATION LOGIC ---
    let deferredPrompt;
    const installBtn = document.getElementById('installBtn');

    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        installBtn.style.display = 'block';
    });

    installBtn.addEventListener('click', (e) => {
        installBtn.style.display = 'none';
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choiceResult) => {
            if (choiceResult.outcome === 'accepted') {
                console.log('User accepted the install prompt');
            }
            deferredPrompt = null;
        });
    });

    // Register Service Worker
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js');
        });
    }

    // --- WEATHER LOGIC (DARKA EXACT) ---
    const LAT = 42.332771;
    const LON = 43.553488;
    const API_URL = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,precipitation,weather_code,surface_pressure,wind_speed_10m,wind_direction_10m,visibility&hourly=temperature_2m,weather_code,precipitation_probability,is_day&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,uv_index_max,precipitation_sum,wind_speed_10m_max,wind_direction_10m_dominant&timezone=auto&forecast_days=10`;

    const KA_DAYS = ['კვირა', 'ორშ', 'სამ', 'ოთხ', 'ხუთ', 'პარ', 'შაბ'];
    const KA_MONTHS = ['იან', 'თებ', 'მარ', 'აპრ', 'მაი', 'ივნ', 'ივლ', 'აგვ', 'სექ', 'ოქტ', 'ნოე', 'დეკ'];

    const weatherIcons = {
        0: {d: "sun", n: "moon", t: "მოწმენდილი"}, 1: {d: "sun-horizon", n: "moon-stars", t: "ნათელი"}, 2: {d: "cloud-sun", n: "cloud-moon", t: "ღრუბლიანი"}, 3: {d: "cloud", n: "cloud", t: "მოღრუბლული"}, 45: {d: "cloud-fog", n: "cloud-fog", t: "ნისლი"}, 48: {d: "cloud-fog", n: "cloud-fog", t: "ჭირხლი"}, 51: {d: "cloud-drizzle", n: "cloud-drizzle", t: "ჟინჟღლი"}, 53: {d: "cloud-drizzle", n: "cloud-drizzle", t: "ჟინჟღლი"}, 55: {d: "cloud-drizzle", n: "cloud-drizzle", t: "ჟინჟღლი"}, 56: {d: "cloud-drizzle", n: "cloud-drizzle", t: "ყინვა-ჟინჟღლი"}, 57: {d: "cloud-drizzle", n: "cloud-drizzle", t: "ყინვა-ჟინჟღლი"}, 61: {d: "cloud-rain", n: "cloud-rain", t: "წვიმა"}, 63: {d: "cloud-rain", n: "cloud-rain", t: "წვიმა"}, 65: {d: "cloud-rain-heavy", n: "cloud-rain-heavy", t: "ძლიერი წვიმა"}, 66: {d: "cloud-rain", n: "cloud-rain", t: "ყინვა-წვიმა"}, 67: {d: "cloud-rain-heavy", n: "cloud-rain-heavy", t: "ძლიერი ყინვა-წვიმა"}, 71: {d: "cloud-snow", n: "cloud-snow", t: "თოვლი"}, 73: {d: "cloud-snow", n: "cloud-snow", t: "თოვლი"}, 75: {d: "snow-flake", n: "snow-flake", t: "ძლიერი თოვლი"}, 77: {d: "cloud-snow", n: "cloud-snow", t: "თოვლის მარცვლები"}, 80: {d: "cloud-rain-heavy", n: "cloud-rain-heavy", t: "თავსხმა"}, 81: {d: "cloud-rain-heavy", n: "cloud-rain-heavy", t: "ძლიერი თავსხმა"}, 82: {d: "cloud-rain-heavy", n: "cloud-rain-heavy", t: "ძლიერი თავსხმა"}, 85: {d: "snow-flake", n: "snow-flake", t: "თოვლ-ჭყაპი"}, 86: {d: "snow-flake", n: "snow-flake", t: "ძლიერი თოვლ-ჭყაპი"}, 95: {d: "cloud-lightning", n: "cloud-lightning", t: "ჭექა-ქუხილი"}, 96: {d: "cloud-lightning-hail", n: "cloud-lightning-hail", t: "სეტყვა"}, 99: {d: "cloud-lightning-hail", n: "cloud-lightning-hail", t: "ძლიერი შტორმი"}
    };

    function getIcon(code, isDay = 1) { const w = weatherIcons[code] || {d: "question", n: "question", t: "უცნობი"}; return { icon: isDay ? w.d : w.n, text: w.t }; }
    function getWindDir(d) { const dirs = ['ჩრდ', 'ჩრდ-აღმ', 'აღმ', 'სამ-აღმ', 'სამ', 'სამ-დას', 'დას', 'ჩრდ-დას']; return dirs[Math.round(d / 45) % 8]; }
    function formatKaDate(dateStr) { const d = new Date(dateStr); return { day: KA_DAYS[d.getDay()], full: `${d.getDate()} ${KA_MONTHS[d.getMonth()]}` }; }

    async function init() {
        try {
            const res = await fetch(API_URL);
            if(!res.ok) throw new Error("Status: " + res.status);
            const data = await res.json();
            if (!data.current) throw new Error("Data incomplete");
            render(data);
        } catch (e) {
            document.getElementById('app').innerHTML = `<div class="glass" style="text-align:center;color:#fca5a5;border-color:red;"><h3>კავშირი გაწყდა</h3><button onclick="location.reload()" class="retry-btn">ხელახლა ცდა</button></div>`;
        }
    }

    function render(data) {
        const cur = data.current; const daily = data.daily; const hourly = data.hourly; const wInfo = getIcon(cur.weather_code, cur.is_day);
        const visibility = cur.visibility ? (cur.visibility/1000).toFixed(1) + "კმ" : "--";
        const updateTime = new Date(cur.time).toLocaleTimeString('ka-GE', {hour:'2-digit', minute:'2-digit'});

        let html = `
            <div class="glass hero">
                <div class="hero-top">
                    <div><div class="temp-huge">${Math.round(cur.temperature_2m)}°</div><div class="condition-text">${wInfo.text}</div><div style="font-size:0.8rem; color:var(--text-muted); font-family: 'JetBrains Mono';">შეგრძნება: ${Math.round(cur.apparent_temperature)}°</div></div>
                    <div class="condition-icon"><i class="ph-fill ph-${wInfo.icon}"></i></div>
                </div>
                <div style="margin-top:20px; display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                     <div style="background:rgba(0,0,0,0.3); padding:10px; border-radius:8px; display:flex; align-items:center; gap:8px;"><i class="ph ph-drop text-accent" style="font-size:1.2rem;"></i><div><span style="font-weight:700; font-family:'JetBrains Mono'">${cur.relative_humidity_2m}%</span> <span class="text-muted" style="font-size:0.6rem;">ტენიანობა</span></div></div>
                     <div style="background:rgba(0,0,0,0.3); padding:10px; border-radius:8px; display:flex; align-items:center; gap:8px;"><i class="ph ph-eye text-accent" style="font-size:1.2rem;"></i><div><span style="font-weight:700; font-family:'JetBrains Mono'">${visibility}</span> <span class="text-muted" style="font-size:0.6rem;">ხილვადობა</span></div></div>
                </div>
                <div class="last-update"><i class="ph ph-crosshair"></i> განახლდა: ${updateTime}</div>
            </div>
            <div class="stats-grid">
                <div class="stat-box wind-box"><div class="stat-label"><i class="ph-fill ph-wind"></i> ქარი / ვექტორი</div><div class="wind-val"><i class="ph-bold ph-arrow-up" style="transform:rotate(${cur.wind_direction_10m}deg); color:var(--accent);"></i><div>${cur.wind_speed_10m} <span style="font-size:0.7em;">კმ/სთ</span><div style="font-size:0.7rem; color:var(--accent);">${getWindDir(cur.wind_direction_10m)}</div></div></div></div>
                <div class="stat-box"><div class="stat-label"><i class="ph-fill ph-gauge"></i> წნევა</div><div class="stat-value">${cur.surface_pressure} <span style="font-size:0.7em;">hPa</span></div></div>
                <div class="stat-box"><div class="stat-label"><i class="ph-fill ph-sun-horizon"></i> მზე ამოდის</div><div class="stat-value">${new Date(daily.sunrise[0]).toLocaleTimeString('ka-GE', {hour:'2-digit', minute:'2-digit'})}</div></div>
            </div>
            <div class="section-title"><i class="ph-fill ph-clock-afternoon"></i> ტაქტიკური პროგნოზი (24სთ)</div>
            <div class="scroll-container">`;
        
        const now = new Date(); const startIdx = Math.max(0, hourly.time.findIndex(t => new Date(t) >= now));
        for(let i=0; i<24; i++) {
            let idx = startIdx+i; if(idx>=hourly.time.length) break;
            html += `<div class="hourly-card"><div class="h-time">${new Date(hourly.time[idx]).getHours()}:00</div><div class="h-icon"><i class="ph-fill ph-${getIcon(hourly.weather_code[idx], hourly.is_day[idx]).icon}"></i></div><div class="h-temp">${Math.round(hourly.temperature_2m[idx])}°</div><div style="font-size:0.7rem; font-family:'JetBrains Mono'; color:${hourly.precipitation_probability[idx]>30?'#38bdf8':'#666'}">${hourly.precipitation_probability[idx]}%</div></div>`;
        }
        html += `</div><div class="section-title" style="margin-top:25px;"><i class="ph-fill ph-calendar-blank"></i> 10 დღის დაზვერვა</div><div class="glass" style="padding:10px 20px;">`;
        for(let i=0; i<10; i++) {
            let dObj = formatKaDate(daily.time[i]);
            html += `<div class="daily-row"><div><span class="d-day">${i===0?'დღეს':dObj.day}</span> <span class="d-date">${dObj.full}</span></div><div style="text-align:center; font-size:0.8rem; font-weight:600; color:${daily.precipitation_sum[i]>0?'#38bdf8':'#475569'};"><i class="ph-fill ph-drop"></i><div style="font-family:'JetBrains Mono'">${Math.round(daily.precipitation_sum[i])}მმ</div></div><div class="d-icon"><i class="ph-fill ph-${getIcon(daily.weather_code[i]).icon}"></i></div><div class="d-temps">${Math.round(daily.temperature_2m_max[i])}° <span class="d-min">${Math.round(daily.temperature_2m_min[i])}°</span></div></div>`;
        }
        html += `</div>`;
        document.getElementById('app').innerHTML = html;
    }
    init(); setInterval(init, 600000);
</script>
</body>
</html>
