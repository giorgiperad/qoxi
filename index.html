<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#f8fafc">
    
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="darya">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2910/2910768.png">

    <title>Darka Life</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;600;700;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        :root {
            --bg: #f8fafc;
            --surface: #ffffff;
            --text-dark: #0f172a;
            --text-light: #64748b;
            --accent-green: #10b981;
            --accent-blue: #3b82f6;
            --accent-orange: #f59e0b;
            --shadow: 0 4px 20px -5px rgba(0,0,0,0.1);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Inter', 'Noto Sans Georgian', sans-serif;
            background-color: var(--bg);
            color: var(--text-dark);
            margin: 0; padding: 20px;
            padding-bottom: 90px;
        }

        .container { max-width: 500px; margin: 0 auto; }

        /* HEADER */
        header { 
            display: flex; justify-content: space-between; align-items: center; 
            margin-bottom: 25px;
        }
        .logo h1 { margin: 0; font-size: 1.6rem; font-weight: 900; letter-spacing: -1px; }
        .logo span { font-size: 0.8rem; color: var(--text-light); font-weight: 600; }
        .gps { background: #e2e8f0; padding: 6px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; cursor: pointer; }

        /* FUN CARD */
        .fun-card {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            color: white; border-radius: 24px; padding: 25px;
            text-align: center; box-shadow: var(--shadow); position: relative;
            overflow: hidden; margin-bottom: 25px;
        }
        .emoji { font-size: 3.5rem; display: block; margin-bottom: 10px; animation: bounce 2s infinite; }
        .title { font-size: 1.4rem; font-weight: 800; margin-bottom: 5px; line-height: 1.2; }
        .sub { font-size: 0.9rem; opacity: 0.8; margin-bottom: 20px; }
        
        .mini-stats {
            display: flex; justify-content: space-between; 
            background: rgba(255,255,255,0.1); padding: 12px 20px; border-radius: 16px;
        }
        .ms-item div:first-child { font-size: 1.1rem; font-weight: 700; }
        .ms-item div:last-child { font-size: 0.7rem; opacity: 0.7; text-transform: uppercase; }

        /* PERCENTAGE GRID */
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 30px; }
        .p-card {
            background: var(--surface); padding: 15px 10px; border-radius: 20px;
            text-align: center; box-shadow: var(--shadow); border: 2px solid transparent;
        }
        .p-icon { font-size: 1.8rem; margin-bottom: 5px; }
        .p-name { font-size: 0.75rem; font-weight: 700; color: var(--text-light); margin-bottom: 5px; }
        .p-val { font-size: 1.1rem; font-weight: 800; }
        .bar { height: 6px; background: #e2e8f0; border-radius: 3px; margin-top: 5px; overflow: hidden; }
        .fill { height: 100%; border-radius: 3px; }

        /* HORIZONTAL SCROLL */
        .sec-head { font-size: 1rem; font-weight: 800; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
        .scroll-wrap { 
            display: flex; gap: 12px; overflow-x: auto; padding-bottom: 15px; 
            margin: 0 -20px; padding-left: 20px; padding-right: 20px;
            scrollbar-width: none; 
        }
        .scroll-wrap::-webkit-scrollbar { display: none; }
        
        .h-item {
            min-width: 75px; background: var(--surface); padding: 15px 10px; 
            border-radius: 18px; text-align: center; border: 1px solid #f1f5f9;
        }
        .h-time { font-size: 0.8rem; color: var(--text-light); font-weight: 600; margin-bottom: 5px; }
        .h-icon { font-size: 1.5rem; margin-bottom: 5px; color: var(--text-dark); }
        .h-temp { font-weight: 700; font-size: 1rem; }

        /* DAILY LIST */
        .day-item {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--surface); padding: 15px; border-radius: 16px;
            margin-bottom: 10px; border: 1px solid #f1f5f9;
        }
        .d-left { display: flex; align-items: center; gap: 15px; }
        .d-icon { font-size: 1.8rem; width: 30px; text-align: center; }
        .d-date h4 { margin: 0; font-size: 0.95rem; }
        .d-date span { font-size: 0.75rem; color: var(--text-light); }
        .d-temp { font-weight: 700; font-size: 1.1rem; }
        .d-low { font-size: 0.9rem; color: var(--text-light); font-weight: 500; margin-left: 5px; }

        /* INSTALL BTN */
        #installBtn {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: var(--text-dark); color: white; border: none;
            padding: 12px 25px; border-radius: 50px; font-weight: 700;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2); display: none; cursor: pointer;
            z-index: 100; align-items: center; gap: 8px;
        }

        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="logo">
            <h1>დარყა</h1>
            <span>ლაშკინის მეტეო-ცენტრი</span>
        </div>
        <div class="gps" onclick="location.reload()"><i class="ph-bold ph-map-pin"></i> დარყა</div>
    </header>

    <div id="app">
        <div style="text-align:center; padding:50px; color:var(--text-light);">
            <i class="ph-bold ph-spinner-gap" style="font-size:2rem; animation:spin 1s infinite linear;"></i>
        </div>
    </div>
    
    <button id="installBtn"><i class="ph-bold ph-download-simple"></i> აპლიკაციის დაყენება</button>
</div>

<script>
    // --- PWA LOGIC ---
    let deferredPrompt; 
    const btn = document.getElementById('installBtn');

    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        btn.style.display = 'flex';
    });

    btn.addEventListener('click', () => {
        btn.style.display = 'none';
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choiceResult) => {
            deferredPrompt = null;
        });
    });

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js');
        });
    }

    // --- WEATHER LOGIC ---
    const API = "https://api.open-meteo.com/v1/forecast?latitude=42.332771&longitude=43.553488&current=temperature_2m,weather_code,wind_speed_10m,precipitation,is_day&hourly=temperature_2m,weather_code,precipitation_probability,is_day&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum&timezone=auto&forecast_days=10";
    
    const DAYS = ['კვირა', 'ორშაბათი', 'სამშაბათი', 'ოთხშაბათი', 'ხუთშაბათი', 'პარასკევი', 'შაბათი'];

    const ICONS = { 0:"sun", 1:"sun-horizon", 2:"cloud-sun", 3:"cloud", 45:"cloud-fog", 51:"cloud-drizzle", 61:"cloud-rain", 63:"cloud-rain", 71:"cloud-snow", 80:"cloud-rain", 95:"cloud-lightning" };
    
    function getIcon(code, isDay=1) { 
        let i = ICONS[code] || "cloud";
        if (!isDay && i === "sun") i = "moon";
        return i;
    }

    // Verdict Generator
    function getVerdict(t, r, w, c, d) {
        if (c>=95) return {t:"აპოკალიფსია!", s:"სახლიდან არ გახვიდე.", e:"⛈️"};
        if (w>25) return {t:"ქარიშხალია!", s:"სახურავებს ხდის.", e:"🌪️"};
        if (r>10) return {t:"წარღვნაა", s:"ნავი დაგჭირდება.", e:"🛶"};
        if (t<0) return {t:"ყინავს!", s:"ჩაიცვი ყველაფერი რაც გაქვს.", e:"🥶"};
        
        // Hunting Logic
        if ([51,53,61,45,2,3].includes(c) && w<15 && d) 
            return {t:"ტყე გეძახის!", s:"სანადიროდ იდეალურია.", e:"🦌"};
            
        // Feasting Logic
        if (r===0 && t>15 && d)
            return {t:"საქეიფოა!", s:"აბა ჰე, მწვადები შეყარე!", e:"🍖"};

        if (!d) return {t:"ღამე მშვიდობისა", s:"ხვალ ახალი დღეა.", e:"🌙"};
        return {t:"სტანდარტული სიტუაცია", s:"არც ცივა, არც ცხელა.", e:"🤷‍♂️"};
    }

    // Score Calc
    function calcScores(t, r, w, c) {
        let h = 50, f = 50, x = 50;
        // Hunt
        if(w<10) h+=20; if(w>20) h-=30;
        if([45,48,2,3].includes(c)) h+=25;
        if(r>5) h-=20;
        // Fish
        if(c==3 || c==2) f+=25;
        if(r>0 && r<5) f+=15;
        if(c<2) f-=10;
        // Feast
        if(r===0) x+=30;
        if(t>18) x+=20;
        if(w>15) x-=30;
        if(r>0) x=10;

        return { 
            h: Math.min(100, Math.max(0, h)), 
            f: Math.min(100, Math.max(0, f)), 
            x: Math.min(100, Math.max(0, x)) 
        };
    }

    async function init() {
        try {
            const res = await fetch(API); 
            const data = await res.json(); 
            render(data);
        } catch(e) { 
            document.getElementById('app').innerHTML = '<div style="text-align:center;padding:50px;">კავშირის შეცდომა</div>'; 
        }
    }

    function render(data) {
        const cur = data.current;
        const v = getVerdict(cur.temperature_2m, cur.precipitation, cur.wind_speed_10m, cur.weather_code, cur.is_day);
        const s = calcScores(cur.temperature_2m, cur.precipitation, cur.wind_speed_10m, cur.weather_code);

        // Hourly Logic Fix: Get accurate next 24 hours
        const now = new Date();
        const startIdx = data.hourly.time.findIndex(t => new Date(t) >= now);
        // If exact hour not found (rare), default to 0, otherwise use found index.
        const safeStartIdx = startIdx === -1 ? 0 : startIdx;
        const next24 = data.hourly.time.slice(safeStartIdx, safeStartIdx + 24);

        let html = `
            <div class="fun-card">
                <span class="emoji">${v.e}</span>
                <div class="title">${v.t}</div>
                <div class="sub">${v.s}</div>
                <div class="mini-stats">
                    <div class="ms-item"><div>${Math.round(cur.temperature_2m)}°</div><div>ტემპ.</div></div>
                    <div class="ms-item"><div>${cur.wind_speed_10m}</div><div>ქარი</div></div>
                    <div class="ms-item"><div>${cur.precipitation}</div><div>წვიმა</div></div>
                </div>
            </div>

            <div class="grid-3">
                <div class="p-card" style="border-color:${s.h>70?'var(--accent-green)':'transparent'}">
                    <div class="p-icon">🦌</div><div class="p-name">ნადირობა</div><div class="p-val">${s.h}%</div>
                    <div class="bar"><div class="fill" style="width:${s.h}%; background:var(--accent-green)"></div></div>
                </div>
                <div class="p-card" style="border-color:${s.f>70?'var(--accent-blue)':'transparent'}">
                    <div class="p-icon">🎣</div><div class="p-name">თევზაობა</div><div class="p-val">${s.f}%</div>
                    <div class="bar"><div class="fill" style="width:${s.f}%; background:var(--accent-blue)"></div></div>
                </div>
                <div class="p-card" style="border-color:${s.x>70?'var(--accent-orange)':'transparent'}">
                    <div class="p-icon">🍷</div><div class="p-name">ქეიფი</div><div class="p-val">${s.x}%</div>
                    <div class="bar"><div class="fill" style="width:${s.x}%; background:var(--accent-orange)"></div></div>
                </div>
            </div>

            <div class="sec-head"><i class="ph-fill ph-clock-afternoon"></i> დღის ამინდი</div>
            <div class="scroll-wrap">
                ${next24.map((t, i) => {
                    // Because we sliced time array, we must offset the index for data arrays
                    const dataIdx = safeStartIdx + i;
                    const hTime = new Date(t);
                    return `
                    <div class="h-item">
                        <div class="h-time">${hTime.getHours()}:00</div>
                        <div class="h-icon"><i class="ph-fill ph-${getIcon(data.hourly.weather_code[dataIdx], data.hourly.is_day[dataIdx])}"></i></div>
                        <div class="h-temp">${Math.round(data.hourly.temperature_2m[dataIdx])}°</div>
                    </div>`;
                }).join('')}
            </div>

            <div class="sec-head" style="margin-top:30px;"><i class="ph-fill ph-calendar-blank"></i> 10 დღის პროგნოზი</div>
            <div>
                ${data.daily.time.map((t, i) => `
                <div class="day-item">
                    <div class="d-left">
                        <div class="d-icon"><i class="ph-fill ph-${getIcon(data.daily.weather_code[i])}"></i></div>
                        <div class="d-date">
                            <h4>${i===0 ? 'დღეს' : DAYS[new Date(t).getDay()]}</h4>
                            <span>${data.daily.precipitation_sum[i] > 0 ? 'წვიმა: '+data.daily.precipitation_sum[i]+'მმ' : 'მშრალი'}</span>
                        </div>
                    </div>
                    <div class="d-temp">
                        ${Math.round(data.daily.temperature_2m_max[i])}°
                        <span class="d-low">${Math.round(data.daily.temperature_2m_min[i])}°</span>
                    </div>
                </div>`).join('')}
            </div>
        `;
        document.getElementById('app').innerHTML = html;
    }
    
    init();
</script>
<style> @keyframes spin { 100% { transform: rotate(360deg); } } </style>
</body>
</html>
